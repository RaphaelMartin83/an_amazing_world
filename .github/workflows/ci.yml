# CI: every pull request into main is built and tested; the binaries are attached as an artifact.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      version: pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.sha }}
