# CD: pushing a version tag (v*) that points at a commit on main builds, tests and publishes a GitHub release
# with the Windows and Linux binaries.
#
#   git tag v1.0.0 && git push origin v1.0.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    name: Tag is on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Refuse tags that are not on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME ($GITHUB_SHA) is not on main - releases are only cut from main."
            exit 1
          fi

  build:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download
          - **Windows:** `*-windows-x86_64.zip` - unzip and run `AnAmazingWorld.exe` (unsigned: SmartScreen may warn, choose "More info" > "Run anyway").
          - **Linux:** `*-linux-x86_64.tar.gz` - extract, then `./AnAmazingWorld.x86_64` (needs a Vulkan-capable GPU).
          - `SHA256SUMS.txt` lets you verify the downloads.

          NOTES
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "An Amazing World $TAG" \
            --notes-file notes.md \
            --generate-notes \
            "${flags[@]}"
