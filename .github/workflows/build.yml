# Reusable build: builds the Docker image, runs the self-test (a bot plays both levels),
# exports the Windows + Linux binaries and uploads them as the "release-files" artifact.
name: Build

on:
  workflow_call:
    inputs:
      version:
        description: Version label used in the file names (e.g. v1.0.0 or pr-12-abc1234)
        type: string
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      # Build the toolchain image (Godot + export templates) with layer caching.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: crash-friend-godot
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Self-test and export (Windows + Linux)
        env:
          SKIP_IMAGE_BUILD: "1"
        run: tools/build.sh

      - name: Package
        env:
          VERSION: ${{ inputs.version }}
        run: tools/package.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: build/release/*
          if-no-files-found: error
          retention-days: 14
